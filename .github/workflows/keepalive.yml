name: keepalive

# Keepalive per i servizi Render Free (dettagli nel README).
# Il curl aspetta fino a 150s per superare il cold start (~50s) di Render,
# cosa che il timeout da 30s di cron-job.org non copriva.
# GitHub Actions usa UTC: 07:00-23:59 UTC copre la fascia ~09:00-00:59
# Europe/Rome in estate e in inverno, lasciando Order spento di notte.

on:
  schedule:
    - cron: '*/5 7-23 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Sveglia OrderPucciotto
        run: |
          echo "Ping Order: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          curl -fsS -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' \
            --connect-timeout 30 --max-time 150 \
            --retry 3 --retry-all-errors --retry-delay 20 \
            https://orderpucciotto.onrender.com/ping \
            || echo "Ping Order fallito (ignorato)"

      # Quiz: opzionale, oggi su cron-job.org. Per attivarlo qui, togliere il
      # commento e aggiungere un cron a mezzogiorno (es. '0 10 * * *' UTC).
      # - name: Keep-alive DB Quiz
      #   run: |
      #     curl -fsS -o /dev/null -w 'HTTP %{http_code}\n' \
      #       --connect-timeout 30 --max-time 150 \
      #       --retry 3 --retry-all-errors --retry-delay 20 \
      #       https://puccioquiz-service.onrender.com/keep-db-alive || true
