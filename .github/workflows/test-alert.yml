name: test-alert (temporaneo)

# Workflow USA E GETTA: serve solo a verificare che l'email di fallimento
# di GitHub arrivi a pucciottolecce@gmail.com. Fallisce apposta.
# Verra' eliminato subito dopo il test.

on:
  workflow_dispatch:

jobs:
  fail-on-purpose:
    runs-on: ubuntu-latest
    steps:
      - name: Fallimento FINTO (solo per test email)
        run: |
          echo "::error::TEST EMAIL: questo e' un fallimento FINTO per verificare l'avviso via mail. NON c'e' nessun problema reale con Order o Quiz."
          exit 1
